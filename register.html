<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Register | Plant Care Reminder</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page">
  <main class="auth-card">
    <div class="auth-brand"><span class="brand-mark">✿</span><span>Plant Care Reminder</span></div>
    <p class="eyebrow">GET STARTED</p><h1>Create your account</h1><p class="muted">Join in and start looking after your plants.</p>
    <form id="registerForm" novalidate>
      <label for="name">Full name</label><input type="text" id="name" autocomplete="name" placeholder="Your name" required>
      <label for="email">Email address</label><input type="email" id="email" autocomplete="email" placeholder="you@example.com" required>
      <label for="password">Password</label><input type="password" id="password" autocomplete="new-password" placeholder="At least 6 characters" required>
      <label for="confirm">Confirm password</label><input type="password" id="confirm" autocomplete="new-password" placeholder="Enter password again" required>
      <div id="message" class="msg" aria-live="polite"></div>
      <button class="btn" type="submit">Create account</button>
    </form>
    <p class="auth-foot">Already have an account? <a href="index.html">Login</a></p>
  </main>
  <script src="js/storage.js"></script><script src="js/auth.js"></script>
</body></html>
